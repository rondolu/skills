presentation_metadata:
  風格: "清新白底、明亮現代、層次分明、系統化、極簡科技、SaaS 級資訊架構"
  核心概念: "以純白為底，翠綠色（38B06A）作為主視覺強調色，鮮黃色（F5C518）作為次要強調色，多層灰階作為輔助色系；每頁透過固定裝飾語彙（頂部色條、底部三色條、左側強調線）統一視覺錨點，在明亮底色上建立清晰資訊層次，兼顧易讀性與品牌一致性。"
  theme_concept: "Fresh Tech Minimal & Premium SaaS"
  aspect_ratio: "16:9"
  language: "繁體中文（含少量英文技術詞彙）"

  design_system:
    color_palette:
      rule: >
        以純白（FFFFFF）為全版背景，翠綠色（38B06A）作為核心強調色，用於數字標籤、
        章節編號、互動元素、左側強調線。鮮黃色（F5C518）作為次要強調色，用於標記、
        提示、CTA 輔助。灰色系（深灰 → 中灰 → 淺灰）作為卡片背景與輔助文字。
        文字色彩依資訊重要程度分層：深炭灰（1A1A1A）→ 中炭灰（4A4A4A）→ 中灰（7A7A7A）→ 淺灰（AEAEAE）。
        警示/錯誤訊息使用橙紅色（F75801），成功/確認使用主色翠綠（38B06A）。
        # 底部永遠有三等份色條（深綠 → 中綠 → 淺綠/黃）作為頁腳識別。

      primary_tones:
        - name: "Pure White（主背景）"
          hex: "FFFFFF"
          usage: "全版背景色，所有頁面的全幅底色"
        - name: "Brand Green（品牌主色）"
          hex: "38B06A"
          usage: "章節編號大字、頁碼標籤、重要 icon、左側強調線、CTA 色塊，全報唯一高亮主色"
        - name: "Soft Green（主色淺版）"
          hex: "D6F0E3"
          usage: "卡片頂部色條、淺色標籤背景、hover 狀態底色"

      neutral_tones:
        - name: "Deep Charcoal（主文字）"
          hex: "1A1A1A"
          usage: "主標題文字、各區塊標題、重要標籤文字"
        - name: "Dark Gray（次要文字）"
          hex: "4A4A4A"
          usage: "副標題、補充說明文字、封面副文"
        - name: "Mid Gray（輔助文字）"
          hex: "7A7A7A"
          usage: "小節標語、說明文字強調、側欄輔助標題"
        - name: "Light Gray（一般正文）"
          hex: "9E9E9E"
          usage: "卡片內正文、說明段落文字（淺色卡片上）"
        - name: "Pale Gray（次要說明）"
          hex: "BDBDBD"
          usage: "限制說明、補充條件文字（低重要性資訊）"
        - name: "Surface Gray（卡片背景）"
          hex: "F5F5F5"
          usage: "內容卡片底色、分區區塊背景（帶 5% 灰調的白）"
        - name: "Card Gray（卡片邊界）"
          hex: "E8E8E8"
          usage: "卡片外框線、分隔線、細線裝飾"
        - name: "Panel Gray（側欄背景）"
          hex: "EFEFEF"
          usage: "左側導航欄背景（比主背景略深）"

      accent_tones:
        - name: "Accent Yellow（次要強調）"
          hex: "F5C518"
          usage: "次要標籤、提示區塊、Rule 02 標題色、警示性規則標籤"
        - name: "Yellow Light（黃色淺版）"
          hex: "FEF7D0"
          usage: "黃色 tag 背景、淺色高亮底"
        - name: "Warning Orange（錯誤/警示）"
          hex: "F75801"
          usage: "錯誤示範文字、警告標示、不符合狀態標示"
        - name: "Gray 30%（低透明灰）"
          hex: "B0B0B0"
          alpha: "30%"
          usage: "裝飾性幾何形狀、點矩陣圖案（低調輔助裝飾）"
        - name: "Gray 15%（極淡灰）"
          hex: "D4D4D4"
          alpha: "15%"
          usage: "背景層次分區、技術堆疊的底層色塊"
        - name: "Green Dark（深綠強調）"
          hex: "217A4A"
          usage: "第三層架構節點標題、強調連結文字、深色對比"
        - name: "Green Mid（中綠）"
          hex: "2E9459"
          usage: "第二層節點標題、次要技術標籤"
        - name: "Tip Gray（提示說明）"
          hex: "8C8C8C"
          usage: "提示說明文字（💡 後的輔助文）"

      gradients: null
      visual_effects:
        # - "左側垂直強調線：所有內容頁左側固定出現寬 5-8pt 的翠綠色（38B06A）矩形條"
        # - "卡片頂部色條：每個內容卡片頂部有 5-8pt 高的翠綠色或黃色矩形作為色標"
        - "無陰影設計：嚴格禁止任何陰影與發光效果，以淺灰色塊與 1pt 線條創造景深與模組感"
        - "Bento 網格縫隙：卡片與卡片之間維持精確的 12-16pt 等距留白，展現秩序感"
        - "幾何項目符號：全面捨棄傳統圓點與 Emoji，改用俐落的幾何符號（如 ■, ✦, ▸, —）作為列點標記"

    typography:
      english_font: "Microsoft JhengHei（微軟正黑體）"
      chinese_font: "Microsoft JhengHei / 微軟正黑體"
      hierarchy:
        slide_title: { size: "40pt", weight: "Bold", color: "1A1A1A", note: "封面主標題" }
        section_header: { size: "28-32pt", weight: "Bold", color: "1A1A1A", note: "各章節頁大標題" }
        hero_metric: { size: "72-96pt", weight: "Bold", color: "38B06A", note: "極大化數據展示，SaaS 核心成效指標" }
        subtitle: { size: "15-16pt", weight: "Bold", color: "38B06A", note: "標題下方說明行" }
        card_title: { size: "18-20pt", weight: "Bold", color: "1A1A1A", note: "Bento Box 或模組卡片的主標題" }
        body_text: { size: "14-16pt", weight: "Bold", line_height: "1.5", color: "4A4A4A", note: "主要段落說明文" }
        annotation: { size: "12-14pt", weight: "Bold", color: "9E9E9E", note: "次要限制說明、標籤內容" }

    layout_rules:
      slide_size: { width_inches: 10.0, height_inches: 5.625 }
      margins: { top: "5pt", bottom: "22pt", left: "30pt", right: "0.0 inches" }
      whitespace: "採用 SaaS 常見的 Macro-whitespace 概念，將畫面的留白視為實體元素，運用留白引導視覺流動。"
      grid_system: "支援傳統分欄外，導入 Bento Box（非對稱但對齊的方塊網格）與層疊式架構圖網格。"

  # 🚀 [升級] 簡報內容模板擴充：SaaS 與科技專業場景
  slide_templates:
    - type: "Cover / Title Slide"
      background: "純色 FFFFFF 全版"
      layout_description: "左側佔 1/3 為淺灰側欄（EFEFEF，含點矩陣裝飾），右側 2/3 為主內容區。極簡且專業的第一印象。"

    - type: "Agenda / Table of Contents"
      background: "純色 FFFFFF 全版"
      layout_description: "左側窄欄放 Agenda 大字，右側以 2x2 結構化卡片展開章節，展現系統化思維。"

    - type: "Content - Bento Box Grid (模組化資訊方塊) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        打破無聊條列！使用當今 UI 最流行的 Bento 佈局。
        右側主內容區分為 3-4 個大小不一的卡片（如：一個大跨度主卡片 + 兩個小正方卡片）。
        所有卡片皆為 F5F5F5 底色 + E8E8E8 邊框，完美對齊且間距均等（16pt）。
        適合在單頁中同時展示「核心概念」、「關鍵數據」與「輔助流程」，層次豐富且具現代感。
      color_mapping:
        card_primary_bg: "F5F5F5"
        card_secondary_bg: "FFFFFF"
        bento_gaps: "FFFFFF (由背景色形成網格縫隙)"
        hero_element: "38B06A"

    - type: "Content - Tech Stack & Architecture (技術架構與堆疊層) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        專為 SaaS 系統架構設計。放棄傳統流程圖，改用「層疊式區塊 (Layered Blocks)」。
        由下至上疊加寬度一致的橫向卡片（代表 Data 層、API 層、App 層等）。
        底層使用 Gray 15% (D4D4D4) 區分系統基石，上層使用 F5F5F5。
        卡片左上角附帶 12pt 的 38B06A 技術標籤，以嚴謹的工程視角展現專業度。
      color_mapping:
        layer_bottom_bg: "D4D4D4"
        layer_mid_bg: "EFEFEF"
        layer_top_bg: "F5F5F5"
        connection_lines: "B0B0B0"
        tech_tag_bg: "D6F0E3"
        tech_tag_text: "217A4A"

    - type: "Content - SaaS Pricing & Feature Tiers (方案比較與定價模型) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        橫向排列 3 個等寬直立卡片，展示 Basic / Pro / Enterprise 方案或技術選項。
        中間的「推薦方案」卡片頂部擁有加粗的翠綠色條（8pt），且卡片背景使用極淡的薄荷綠 (D6F0E3 10%透明度或純 F5F5F5 搭配綠色框線) 突出顯示。
        項目符號捨棄 Emoji，正向表述使用純色小方塊「■」或極簡「✓」(38B06A)，負向/未包含項目使用俐落的短橫線「—」或「✕」(BDBDBD)。
      color_mapping:
        tier_standard_bg: "F5F5F5"
        tier_premium_border: "38B06A"
        check_icon: "38B06A"
        cross_icon: "BDBDBD"
        price_text: "1A1A1A"

    - type: "Content - Hero Metric / Big Statement (大數據與核心主張) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        針對投資人或決策者的衝擊力頁面。捨棄多餘文字，將一個關鍵數據放大至 96pt（使用品牌主色 38B06A），
        置於畫面視覺中心偏左，右側或下方搭配 20pt 的深灰色精煉註解。
        運用極大量的白空間 (Negative Space) 營造自信與權威感，這是頂級科技發佈會常用的手法。
      color_mapping:
        hero_number: "38B06A"
        statement_text: "1A1A1A"
        subtext: "7A7A7A"
        decorator_dot: "F5C518"

    - type: "Content - Product Roadmap (產品與技術路線圖) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        使用一條橫跨畫面的 1pt E8E8E8 主軸線。
        線上分布時間節點，每個節點拉出交錯的資訊卡片（上、下、上、下配置）。
        已完成的節點使用實心翠綠圓點 (38B06A)，未來節點使用空心灰線圓圈 (E8E8E8)。
        摒棄傳統甘特圖的沉重感，以輕量級視覺傳遞敏捷開發 (Agile) 節奏。
      color_mapping:
        axis_line: "E8E8E8"
        node_completed: "38B06A"
        node_future: "FFFFFF (加上 E8E8E8 框線)"
        milestone_title: "1A1A1A"

    - type: "Content - Dashboard & UI Showcase (系統介面/數據儀表板展示) [NEW]"
      background: "純色 FFFFFF"
      layout_description: >
        專為軟體介面展示設計。主畫面放置一個比例正確的 F5F5F5 矩形作為「軟體框架」，
        周圍拉出極細的 1pt 直線 (E8E8E8) 連結到畫面邊緣的解說小卡片 (Tooltip style)。
        沒有真實的陰影，完全依賴扁平化的框線與色塊表達 UI 的高科技感。
      color_mapping:
        mockup_bg: "F5F5F5"
        mockup_border: "E8E8E8"
        callout_line: "38B06A"
        callout_card_bg: "FFFFFF"
        callout_card_border: "E8E8E8"

    - type: "Content - Three-Card Comparison（三欄卡片比較）"
      background: "純色 FFFFFF"
      layout_description: "保留原本的三欄並排比較結構，針對規則說明（Rule 01/02/03）非常實用。"

    - type: "Closing / Thank You"
      background: "純色 FFFFFF"
      layout_description: "結尾頁，結合聯絡資訊卡片，俐落收尾。"

  instructions_for_generation:
    - "Tone: 清新極簡科技風，明亮且具現代感。傳達 SaaS 產業特有的「清晰、高效、模組化」信息。"
    - "Design Philosophy: 拋棄傳統 PowerPoint 項目符號思維。將內容視為 UI 元件，全面採用卡片 (Cards)、容器 (Containers) 與網格 (Grids) 進行排版。"
    - "Iconography (去 AI 罐頭感): 絕對禁止使用 Emoji（如 ✅, ❌, 💡, 🚀 等）作為圖示！這會產生強烈的廉價 AI 生成感。請一律使用俐落的幾何符號（如 ■, ✦, ↳, ▸）或專業 UI 向量圖標庫（如 Lucide / PhosphorIcons 的 1.5px 極簡線條風格）。"
    - "Color discipline: 嚴格控制用色。主色 38B06A，次要 F5C518，警示 F75801。所有深色背景皆改為全白 FFFFFF。"
    - "Typography: 微軟正黑體，全粗體 (Bold)。遵循嚴格的字體大小階層 (14pt 到 96pt Hero Metric)。"
    - "Recurring decorators: 頂部 5pt 綠色條、底部三等份色條、左側 5-8pt 綠色強調線，這些是不可撼動的品牌識別。"
    - "Bento Box Rule: 處理複雜資訊時，優先選用 Bento Grid。在畫面上切分出 3-5 個不同尺寸但精準對齊的 F5F5F5 卡片，利用空間與大小暗示資訊權重。"
    - "No Shadows/Effects: 全面禁用陰影、漸層與毛玻璃效果。層次感必須透過底色變化 (FFFFFF 上的 F5F5F5 卡片) 與 1pt 邊框來實現。"
    - "Whitespace as Structure: 留白不是「空出來的地方」，而是區隔模組的隱形牆壁。在卡片與卡片之間維持絕對的呼吸空間。"